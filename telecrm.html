<script>
/* Standalone demo mode: accounts and CRM demo data are stored only in this browser. No server or database is used. */
const LIVE=false;
const sb=null;
const API_BASE='';
const AUTH_TOKEN_KEY='clientflow_auth_token';
async function authRequest(path,body,method='POST'){const token=sessionStorage.getItem(AUTH_TOKEN_KEY);const r=await fetch(API_BASE+path,{method,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json().catch(()=>({error:'Unexpected server response'}));if(!r.ok)throw new Error(data.error||'Request failed');return data;}

const dg=p=>String(p||'').replace(/\D/g,''),over=d=>d&&new Date(d)<new Date();
const ldt=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
const tmr=()=>{const d=new Date();d.setDate(d.getDate()+1);d.setHours(10,0,0,0);return ldt(d)};
const NAMES=['New Lead','Not Contacted','Call Attempted','Connected','Interested','Highly Interested','Follow-up Required','Meeting Scheduled','Demo Scheduled','Proposal Sent','Negotiation','Won','Lost','Not Interested','Invalid Number','Wrong Number','No Response','Busy','Switched Off','Do Not Contact'];
const OUTCOMES=['Connected','No Answer','Busy','Switched Off','Wrong Number','Interested','Not Interested','Callback Requested'];
let me=null,statuses=[],S={tab:'dash',q:'',status:'',page:0,fu:'today',rows:[],fuRows:[]};const PAGE=20;
const sname=l=>statuses.find(s=>s.id===l.status_id)?.name||'—';
const sc=n=>n==='Won'?'ok':/Lost|Not Interested|Invalid|Wrong|Do Not/.test(n)?'bad':/Follow|Meeting|Demo|Proposal|Negotiation/.test(n)?'warn':/Interested|Connected/.test(n)?'blue':'';
const rng=()=>{const s=new Date();s.setHours(0,0,0,0);const e=new Date();e.setHours(23,59,59,999);return[s,e]};
const inTab=(f,t)=>{const[s,e]=rng(),d=new Date(f.due_at);return t==='done'?f.status==='completed':f.status==='pending'&&(t==='today'?d>=s&&d<=e:t==='upcoming'?d>e:d<new Date())};

/* ---------- Demo store (only when no Supabase keys). Clearly demo data. ---------- */
let D;try{D=JSON.parse(localStorage.getItem('telecrm_demo'))}catch(e){}
if(!D)D={leads:[],fus:[],acts:[]};

const act=(lid,kind,detail)=>D.acts.push({id:uid(),lead_id:lid,kind,detail,created_at:new Date().toISOString(),profiles:{full_name:me.full_name}});
const nxt=id=>D.fus.filter(f=>f.lead_id===id&&f.status==='pending').map(f=>f.due_at).sort()[0];

/* ---------- Data layer: same calls work for Supabase and demo ---------- */
const api={
async leads(){

async function vWeb(){const base=location.href.split('#')[0].split('?')[0],p=new URLSearchParams(location.search),U=Object.keys(SET.utm).filter(k=>SET.utm[k]);
 M(`${head('Website Enquiries','<span class="badge ok">● Form active</span><span class="badge warn">Embed not yet verified</span>')}<div class="grid"><div class="card"><h3>Lead form URL & embed</h3><code>${esc(base)}?form=1</code><p class="mut">Embed code (once this CRM is hosted with Supabase keys, point the form to its endpoint):</p><pre class="code">${esc(`<iframe src="${base}?form=1&utm_source=website" width="100%" height="520" style="border:0"></iframe>`)}</pre><button class="btn g" onclick="navigator.clipboard&&navigator.clipboard.writeText('${esc(base)}?form=1');toast('URL copied.')">Copy URL</button></div>
 <div class="card"><h3>Preview form</h3><input id="wn" placeholder="Name *"><input id="wp" type="tel" placeholder="Phone *"><input id="we" type="email" placeholder="Email"><input id="wc" placeholder="Company"><textarea id="wm" rows="2" placeholder="Enquiry"></textarea>${U.map(k=>`<input type="hidden" class="wu" data-k="${k}" value="${esc(p.get(k)||'')}">`).join('')}<small class="mut">Hidden UTM fields captured: ${U.join(', ')||'none'} · Source: Website · auto-assigned by the same service</small><br><br><button class="btn w" onclick="subWeb(0)">Submit enquiry</button><br><br><button class="btn g w" onclick="subWeb(1)">Run test submission</button></div></div>`)}
function subWeb(test){run(async()=>{const utm={};document.querySelectorAll('.wu').forEach(i=>utm[i.dataset.k]=i.value||(test?'test-'+i.dataset.k.slice(4):''));const d=test?{name:'Test Enquiry '+Date.now().toString().slice(-4),phone:'+9199'+Math.floor(1e8+Math.random()*9e8),email:'',company:'Test Co'}:{name:$('wn').value.trim(),phone:$('wp').value.trim(),email:$('we').value.trim(),company:$('wc').value.trim()};
 if(!d.name||!d.phone)throw new Error('Name and phone are required.');const id=await api.addLead({...d,source:'Website',utm});if(!test&&$('wm').value.trim())await api.note(id,$('wm').value.trim());toast(test?'Test lead created ✔ (check Leads)':'Enquiry captured and assigned.')})}

/* --- Activity timeline --- */
const T={lead:'',kind:''};
async function vTl(id){if(id)T.lead=id;const A=await api.allActs(),L=(await api.all()).filter(vis),ok=new Set(L.map(l=>l.id)),r=A.filter(a=>ok.has(a.lead_id)&&(!T.lead||a.lead_id===T.lead)&&(!T.kind||a.kind===T.kind)).slice(0,100);
 M(`${head('Activity Timeline')}<div class="flt"><select onchange="T.lead=this.value;vTl()">${opt(L.map(l=>[l.id,l.name]),T.lead,'All leads')}</select><select onchange="T.kind=this.value;vTl()">${opt(Object.keys(ICO).map(k=>[k,label({kind:k,detail:{}}).split(':')[0]||k]),T.kind,'All events')}</select></div><p class="mut">History is append-only: events cannot be edited or deleted.</p><div class="tl2">${r.map(a=>`<div data-i="${ICO[a.kind]||'•'}"><b>${esc(label(a))}</b><br><small>${esc(a.leads?.name||'')} · ${esc(a.profiles?.full_name||'System')} · ${fmt(a.created_at)}</small></div>`).join('')||'<p class="mut">No events.</p>'}</div>`)}

/* --- Import / Export --- */
const IM={step:1,head:[],rows:[],map:{},own:'rr',res:null,fu:{on:true,at:tmr(),type:'call',gap:10,notes:'First call after import'}},FLD=[['name','Name *'],['phone','Phone'],['email','Email'],['company','Company'],['source','Source'],['deal_value','Deal value']];
function parseCSV(t){const r=[];let c=[],f='',q=false;for(let i=0;i<t.length;i++){const x=t[i];if(q){if(x=='"'&&t[i+1]=='"'){f+='"';i++}else if(x=='"')q=false;else f+=x}else if(x=='"')q=true;else if(x==','){c.push(f);f=''}else if(x=='\n'||x=='\r'){if(x=='\r'&&t[i+1]=='\n')i++;c.push(f);f='';r.push(c);c=[]}else f+=x}if(f||c.length){c.push(f);r.push(c)}return r.filter(x=>x.some(v=>v.trim()))}
function vImp(){const st=['Upload','Map columns','Validate','Duplicates','Assign','Result'];
 const bar=`<div class="stp">${st.map((s,i)=>`<span class="${IM.step===i+1?'on':IM.step>i+1?'dn':''}" ${IM.step>i+1&&IM.step<6?`onclick="IM.step=${i+1};vImp()" style="cursor:pointer" title="Go back to this step"`:''}>${i+1}. ${s}</span>`).join('')}</div>`;let b='';
 if(IM.step===1)b=`<div class="card"><h3>1. Upload Excel or CSV</h3><input type="file" id="fi" accept=".csv,.xlsx,.xls" onchange="impFile(this.files[0])"><button class="btn g" onclick="dl([['name','phone','email','company','source','deal_value'],['Sample Lead','9876543210','sample@mail.com','Sample Co','Website','50000']],'lead-template.csv')">Download template</button></div>`;
 else if(IM.step===2)b=`<div class="card"><h3>2. Map spreadsheet columns (${IM.rows.length} rows)</h3>${FLD.map(([k,l])=>`<label>${l}</label><select onchange="IM.map['${k}']=this.value">${opt(IM.head.map((h,i)=>[String(i),h]),IM.map[k],'— skip —')}</select>`).join('')}<br><button class="btn" onclick="impCheck()">Next: validate</button></div>`;
 else if(IM.step===3||IM.step===4){const c=IM.chk;b=`<div class="kpis">${kpi('Valid',c.ok.length,'ok')}${kpi('Invalid',c.bad.length,'er')}${kpi('Duplicates',c.dup.length)}</div><div class="card"><h3>${IM.step===3?'3. Preview & validate':'4. Duplicates & errors'}</h3>${(IM.step===3?c.ok.slice(0,8):[...c.bad,...c.dup].slice(0,12)).map(r=>`<div class="row2"><span>${esc(r.name||'(no name)')} <small>${esc(r.phone||r.email||'')}</small></span><small class="${r.why?'err':''}">${esc(r.why||'ok')}</small></div>`).join('')||'<p class="mut">None 🎉</p>'}<br><button class="btn" onclick="IM.step++;vImp()">Next</button></div>`}
 else if(IM.step===5)b=`<div class="card"><h3>5. Assign owners</h3><select onchange="IM.own=this.value">${opt([['rr','Use assignment rules / round-robin'],...pool().map(t=>[t.id,'All to '+t.name])],IM.own)}</select><div class="row2"><span><b>Create a follow-up for every imported lead</b></span>${sw(IM.fu.on,"IM.fu.on=this.checked;vImp()")}</div>${IM.fu.on?`<label>First follow-up</label><input type="datetime-local" value="${IM.fu.at}" onchange="IM.fu.at=this.value"><label>Type</label><select onchange="IM.fu.type=this.value">${opt(Object.keys(TY),IM.fu.type)}</select><label>Minutes between each lead</label><input type="number" min="0" value="${IM.fu.gap}" onchange="IM.fu.gap=+this.value"><input placeholder="Follow-up note" value="${esc(IM.fu.notes)}" onchange="IM.fu.notes=this.value">`:''}<br><button class="btn" onclick="impRun()">Import ${IM.chk.ok.length} leads</button></div>`;
 else b=`<div class="kpis">${kpi('Imported',IM.res.ok,'ok')}${kpi('Skipped',IM.res.skip)}${kpi('Duplicate',IM.res.dup)}${kpi('Invalid',IM.res.bad,'er')}${kpi('Follow-ups set',IM.res.fu||0)}</div><button class="btn" onclick="IM.step=1;vImp()">Import another file</button> <button class="btn g" onclick="go('leads')">View leads</button>`;
 M(`${head('Import / Export')}${canEdit()?bar+b:'<p class="note">Your role is read-only.</p>'}<div class="card" style="margin-top:14px"><h3>Export</h3><p class="mut">Exports respect your role and active filters on the Leads page.</p><button class="btn g" ${canExp()?'':'disabled'} onclick="api.all().then(a=>{S.all=a.filter(vis);expLeads()})">Export leads (${canExp()?'allowed':'admin/manager only'})</button></div>`)}
async function impFile(f){if(!f)return;run(async()=>{S.all=await api.all();let rows;if(/\.csv$/i.test(f.name))rows=parseCSV(await f.text());else{if(!window.XLSX)await new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=ok;s.onerror=()=>no(new Error('Could not load the Excel reader. Save as CSV and retry.'));document.head.appendChild(s)});const w=XLSX.read(await f.arrayBuffer());rows=XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{header:1,defval:''}).filter(r=>r.some(v=>String(v).trim()))}
 if(rows.length<2)throw new Error('The file has no data rows.');IM.head=rows[0].map(String);IM.rows=rows.slice(1);IM.map={};FLD.forEach(([k])=>{const i=IM.head.findIndex(h=>h.toLowerCase().replace(/[^a-z]/g,'').includes(k==='deal_value'?'value':k));if(i>=0)IM.map[k]=String(i)});IM.step=2;vImp()})}
function impCheck(){if(!IM.map.name)return toast('Map the Name column.');const g=(r,k)=>IM.map[k]!==undefined&&IM.map[k]!==''?String(r[IM.map[k]]??'').trim():'',seen=new Set(),ex=new Set(S.all?.flatMap(l=>[l.phone,l.email&&l.email.toLowerCase()])||[]),c={ok:[],bad:[],dup:[]};
 IM.rows.forEach(r=>{const o={name:g(r,'name'),phone:g(r,'phone').replace(/[^\d+]/g,''),email:g(r,'email'),company:g(r,'company'),source:g(r,'source')||'Excel import',deal_value:g(r,'deal_value')};if(o.phone&&/^\d{10}$/.test(o.phone))o.phone='+91'+o.phone;
 if(!o.name)return c.bad.push({...o,why:'Missing name'});if(!o.phone&&!o.email)return c.bad.push({...o,why:'Needs phone or email'});if(o.phone&&!/^\+?\d{10,14}$/.test(o.phone))return c.bad.push({...o,why:'Invalid phone'});if(o.email&&!EMAIL.test(o.email))return c.bad.push({...o,why:'Invalid email'});
 const k=[o.phone,o.email&&o.email.toLowerCase()].filter(Boolean);if(k.some(x=>ex.has(x)||seen.has(x)))return c.dup.push({...o,why:'Duplicate'});k.forEach(x=>seen.add(x));c.ok.push(o)});IM.chk=c;IM.step=3;vImp()}
function impRun(){run(async()=>{const r={ok:0,skip:0,fu:0,dup:IM.chk.dup.length,bad:IM.chk.bad.length};let i=0;for(const o of IM.chk.ok){try{const id=await api.addLead({...o,deal_value:o.deal_value?Number(o.deal_value):null,owner_id:IM.own==='rr'?undefined:IM.own});await logAct(id,'imported',{});r.ok++;if(IM.fu.on&&IM.fu.at){await api.addFu({lead_id:id,due_at:new Date(new Date(IM.fu.at).getTime()+i*IM.fu.gap*6e4).toISOString(),type:IM.fu.type,notes:IM.fu.notes});r.fu++}i++}catch(e){r.skip++}}IM.res=r;IM.step=6;vImp()})}

/* --- Team members --- */
async function vTeam(){S.all=await api.all();const adm=me.role==='admin';
 M(`${head('Team Members')}${adm&&!LIVE?`<div class="card"><h3>Invite team member</h3><div class="flt"><input id="tnm" placeholder="Name"><input id="ttl" placeholder="Designation"><input id="tem" type="email" placeholder="Email"><select id="trl">${opt(['manager','sales','viewer'])}</select><button class="btn" onclick="invite()">Send invite</button></div></div>`:`<p class="note">${LIVE?'Invite users from Supabase Auth; they appear here once they sign in.':'Only admins can invite.'}</p>`}
 <div class="tw"><table class="tbl"><thead><tr><th>Name</th><th>Designation</th><th>Email</th><th>Role</th><th>Active</th><th>Leads</th><th>Last login</th></tr></thead><tbody>${team().map(t=>`<tr><td><b>${esc(t.name)}</b></td><td>${esc(t.title||'')}</td><td>${esc(t.email)}</td><td>${adm&&!LIVE&&t.id!==me.id?`<select style="margin:0" onchange="D.team.find(x=>x.id==='${t.id}').role=this.value;save();vTeam()">${opt(['manager','sales','viewer'],t.role)}</select>`:t.role}</td><td>${sw(!SET.inactive[t.id],`SET.inactive['${t.id}']=!this.checked;save()`)}</td><td>${S.all.filter(l=>(l.owner_id||me.id)===t.id).length}</td><td>${fmt(t.login)}</td></tr>`).join('')}</tbody></table></div>
 <div class="grid" style="margin-top:14px"><div class="card"><h3>Roles & permissions</h3><p><b>Admin</b> — all settings, reports and leads.</p><p><b>Manager</b> — team leads, assignment, team reports, export.</p><p><b>Salesperson</b> — only their assigned leads, notes and follow-ups.</p><p><b>Viewer</b> — read-only access.</p></div></div>`)}
function invite(){const n=$('tnm').value.trim(),e=$('tem').value.trim();if(!n||!EMAIL.test(e))return toast('Enter a name and valid email.');D.team.push({id:'t'+uid(),name:n,title:$('ttl').value.trim(),email:e,role:$('trl').value,target:100000,login:null});save();toast('Invite recorded (demo).');vTeam()}

/* --- Settings --- */
async function vSet(){const st=(on,t)=>`<span class="badge ${on?'ok':'warn'}">${t}</span>`;
 M(`${head('Settings')}<details class="card" open><summary>Lead stages & status labels</summary>${statuses.map(s=>`<span class="badge ${sc(s.name)}">${esc(s.name)}</span>`).join('')}<p class="mut">${LIVE?'Stages are stored in your Supabase lead_statuses table.':'Demo stages are fixed; with Supabase connected, edit the lead_statuses table.'}</p></details>
 <details class="card"><summary>Lead sources</summary>${SET.sources.map((s,i)=>`<span class="pill">${esc(s)}<a onclick="SET.sources.splice(${i},1);save();vSet()">✕</a></span>`).join('')}<div class="flt" style="margin-top:8px"><input id="ns2" placeholder="New source"><button class="btn" onclick="const v=$('ns2').value.trim();if(v&&!SET.sources.includes(v)){SET.sources.push(v);save();vSet()}">Add</button></div></details>
 <details class="card"><summary>Assignment rules</summary><div class="row2"><span>Round-robin ${st(SET.rr,SET.rr?'On':'Off')}</span><button class="btn g" onclick="go('assign')">Configure</button></div></details>
 <details class="card"><summary>Follow-up reminders</summary><div class="row2"><span>In-app reminders</span>${sw(SET.remind,'SET.remind=this.checked;save()')}</div><label>Remind this many minutes before due</label><input type="number" min="0" value="${SET.remMin}" onchange="SET.remMin=+this.value;save()"><button class="btn g" onclick="window.Notification&&Notification.requestPermission().then(p=>toast('Notifications: '+p))">Enable browser notifications</button></details>
 <details class="card"><summary>Website form integration</summary><div class="row2"><span>Form endpoint</span>${st(1,'Configured')}</div><button class="btn g" onclick="go('web')">Open form settings</button></details>
 <details class="card"><summary>UTM attribution</summary>${Object.keys(SET.utm).map(k=>`<div class="row2"><code style="display:inline;margin:0">${k}</code>${sw(SET.utm[k],`SET.utm['${k}']=this.checked?1:0;save()`)}</div>`).join('')}<p class="mut">Original source is preserved even if a salesperson edits the lead.</p></details>
 <details class="card"><summary>WhatsApp & calling</summary><div class="row2"><span>WhatsApp click-to-chat</span>${sw(SET.wab,'SET.wab=this.checked?1:0;save()')}${st(SET.wab,SET.wab?'Connected':'Off')}</div><div class="row2"><span>Phone dialer (tel:)</span>${sw(SET.call,'SET.call=this.checked?1:0;save()')}${st(SET.call,SET.call?'Connected':'Off')}</div><label>Default WhatsApp message ({name} = lead name)</label><textarea rows="2" onchange="SET.wa=this.value;save()">${esc(SET.wa)}</textarea></details>
 <details class="card"><summary>Data export & security</summary><div class="row2"><span>Only admin/manager can export</span>${sw(SET.reqAdmin,'SET.reqAdmin=this.checked?1:0;save()')}</div>${LIVE?'':'<button class="btn g" onclick="if(confirm(\'Reset all demo data?\')){localStorage.removeItem(\'telecrm_demo\');location.reload()}">Reset demo data</button>'}</details>`)}

boot();

</script></body></html>
